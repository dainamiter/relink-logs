name: Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Bypass deploy key
        shell: bash
        run: echo "Bypassing deploy key check for fork."

      - name: Pass current version
        id: v
        shell: bash
        run: |
          file_version="$(node -p "require('./package.json').version")"
          # 直接读取当前版本，不进行任何 git 提交和推送
          {
            echo "version=$file_version"
            echo "prerelease=true"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build-hook:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set auto-self-update disable
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build hook DLL
        env:
          HOOK_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --package hook --features eject

      # 删除了 Azure 签名步骤

      - uses: actions/upload-artifact@v4
        with:
          name: hook-dll
          path: target/release/hook.dll
          if-no-files-found: error

  build-windows:
    needs: [version, build-hook]
    runs-on: windows-latest
    env:
      PRODUCT: GBFR Logs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set auto-self-update disable
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Stage signed hook.dll
        uses: actions/download-artifact@v4
        with:
          name: hook-dll
          path: src-tauri
          
      - name: Mirror signed hook.dll to the cargo output path
        shell: bash
        run: mkdir -p target/release && cp src-tauri/hook.dll target/release/hook.dll

      - name: Build frontend and write CI build config
        shell: pwsh
        run: |
          npm run build
          # 移除了所有的 signCommand 签名脚本注入
          $cfg = [ordered]@{
            build = @{ beforeBuildCommand = "" }
          }
          $cfg | ConvertTo-Json -Depth 6 | Set-Content -Path .tauri-release-config.json -Encoding utf8

      - name: Build and bundle app
        # 移除了 updater 选项，不生成 updater 从而绕过私钥签名报错
        run: npx tauri build --config .tauri-release-config.json

      # 删除了 Verify exe and MSI signatures 验证步骤

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            target/release/bundle/msi/*.msi
            target/release/*.exe
          if-no-files-found: error

  build-linux:
    needs: [version, build-hook]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri v1 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades \
            libwebkit2gtk-4.0-dev=2.36.0-2ubuntu1 \
            libwebkit2gtk-4.0-37=2.36.0-2ubuntu1 \
            libjavascriptcoregtk-4.0-dev=2.36.0-2ubuntu1 \
            libjavascriptcoregtk-4.0-18=2.36.0-2ubuntu1 \
            gir1.2-javascriptcoregtk-4.0=2.36.0-2ubuntu1 \
            gir1.2-webkit2-4.0=2.36.0-2ubuntu1 \
            build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install pinned Rust toolchain
        run: |
          rustup set auto-self-update disable
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Stage signed hook.dll
        uses: actions/download-artifact@v4
        with:
          name: hook-dll
          path: src-tauri

      - name: Build frontend and write CI build config
        run: |
          npm run build
          echo '{"build":{"beforeBuildCommand":""}}' > .tauri-release-config.json

      - name: Build and bundle app (AppImage)
        # 移除了 updater 选项
        run: npx tauri build -b appimage --config .tauri-release-config.json
        env:
          TAURI_TRAY: ayatana

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write release notes
        shell: bash
        run: |
          {
            echo "Portable Build ($VERSION)"
            echo "Make sure to save and exit the game before updating."
          } > notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          pattern: "*-bundle"
          merge-multiple: true

      - name: Flatten downloaded artifacts
        run: |
          find dist-assets -mindepth 2 -type f -exec mv -t dist-assets {} +
          find dist-assets -mindepth 1 -type d -empty -delete
          ls -l dist-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION-portable" dist-assets/* \
            --target "$TARGET_SHA" \
            --title "Relink Logs $VERSION Portable" \
            --notes-file notes.md \
            --prerelease

  # 完全移除了 promote 环节（自动合并 main 分支），不需要它。
